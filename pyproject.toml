# Workspace root.
#
# This file exists so `uv` recognizes the repo as a workspace and can resolve the
# `backend/` (deployable application) package from a single venv. It is NOT a
# deployable package itself — nothing here ships to production.
#
# Most commands work from anywhere in the repo:
#
#     uv sync             # syncs the workspace (one venv shared by all members)
#     uv run pytest       # runs the backend test suite

[project]
name = "gtm-waterfall-enrichment-workspace"
version = "0"
description = "Workspace root — see backend/ for the actual package."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["backend"]
